# Runs on every push to main and on every pull request, so nothing is merged
# unless the package builds, the tests pass and the published types resolve.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup engine & package manager 🗜️
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          version: 12
          install: false

      - name: Install dependencies 💼
        run: pnpm install --frozen-lockfile

      - name: Build 📦️
        run: pnpm build

      - name: Check 👀
        run: pnpm check

      - name: Test 🧪
        run: pnpm test

      # The "attw" ignore-rules referenced above are part of the "check" script in
      # package.json, so the tarball types are still verified on every push and PR.
      #   - cjs-resolves-to-esm: the package is ESM only.
      #   - internal-resolution-error: the root entrypoint re-exports "./InlineSvg.svelte",
      #     and the node16 resolver cannot load a ".svelte" file on its own.
      # Every other resolution has to stay green.
